name: Deploy TodoF1

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: todof1-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to alwaysdata
    runs-on: ubuntu-latest

    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy TodoF1
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          ssh -i ~/.ssh/id_ed25519 \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" \
            'cd /home/todof1/todof1-app || exit 1; echo "===== DIAGNOSTICO FSCK AMPLIADO (TEMPORAL): INICIO ====="; echo "--- git --version ---"; git --version 2>&1; echo "[exit=$?]"; echo "--- git status --short ---"; git status --short 2>&1; echo "[exit=$?]"; echo "--- git log -1 --oneline ---"; git log -1 --oneline 2>&1; echo "[exit=$?]"; echo "--- git remote -v ---"; git remote -v 2>&1; echo "[exit=$?]"; echo "--- git for-each-ref ---"; git for-each-ref --format="%(refname) %(objecttype) %(objectname)" 2>&1; echo "[exit=$?]"; echo "--- git show-ref ---"; git show-ref 2>&1; echo "[exit=$?]"; echo "--- refs y existencia de objetos (cat-file -e) ---"; for r in $(git for-each-ref --format="%(refname)"); do sha=$(git rev-parse --verify --quiet "$r" 2>/dev/null); if [ -z "$sha" ]; then echo "REF_ROTA $r"; elif git cat-file -e "$sha" 2>/dev/null; then echo "OK $r ($sha)"; else echo "OBJETO_FALTANTE $r ($sha)"; fi; done; echo "--- ref refs/remotes/origin/backup-github ---"; cat .git/refs/remotes/origin/backup-github 2>&1; echo "[cat_exit=$?]"; grep -n "backup-github" .git/packed-refs 2>&1; echo "[grep_exit=$?]"; git rev-parse --verify refs/remotes/origin/backup-github 2>&1; echo "[rev_parse_exit=$?]"; echo "--- git fsck --full ---"; git fsck --full 2>&1; echo "[fsck_exit=$?]"; echo "--- git fsck --full --strict ---"; git fsck --full --strict 2>&1; echo "[fsck_strict_exit=$?]"; echo "--- git fsck --full --unreachable --no-reflogs ---"; git fsck --full --unreachable --no-reflogs 2>&1; echo "[fsck_unreach_exit=$?]"; echo "--- git count-objects -v ---"; git count-objects -v 2>&1; echo "[exit=$?]"; echo "--- git reflog -10 ---"; git reflog -10 2>&1; echo "[exit=$?]"; echo "--- df -h (directorio del proyecto) ---"; df -h . 2>&1; echo "[exit=$?]"; echo "--- du -sh .git ---"; du -sh .git 2>&1; echo "[exit=$?]"; echo "===== DIAGNOSTICO FSCK AMPLIADO (TEMPORAL): FIN ====="; if git remote get-url origin >/dev/null 2>&1; then git remote set-url origin https://github.com/Daniel-Zarco/TodoF1.git; else git remote add origin https://github.com/Daniel-Zarco/TodoF1.git; fi; bash deploy/deploy.sh'
