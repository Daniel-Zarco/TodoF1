name: Deploy TodoF1

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: todof1-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to alwaysdata
    runs-on: ubuntu-latest

    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy TodoF1
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          ssh -i ~/.ssh/id_ed25519 \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" \
            'cd /home/todof1/todof1-app || exit 1; if git remote get-url origin >/dev/null 2>&1; then git remote set-url origin https://github.com/Daniel-Zarco/TodoF1.git; else git remote add origin https://github.com/Daniel-Zarco/TodoF1.git; fi; echo "===== DIAGNOSTICO TODO F1 (TEMPORAL): INICIO ====="; echo "--- git status --short ---"; git status --short 2>&1; echo "[exit=$?]"; echo "--- git log -1 --oneline ---"; git log -1 --oneline 2>&1; echo "[exit=$?]"; echo "--- git remote -v ---"; git remote -v 2>&1; echo "[exit=$?]"; echo "--- git fsck --full ---"; git fsck --full 2>&1; echo "[exit=$?]"; echo "--- df -h ---"; df -h 2>&1; echo "[exit=$?]"; echo "===== DIAGNOSTICO TODO F1 (TEMPORAL): FIN ====="; bash deploy/deploy.sh'
