name: Recuperacion Fase 2 - backup y clon de verificacion

# WORKFLOW MANUAL (solo workflow_dispatch). No se ejecuta en push.
# FASE 2 (no destructiva, NO sustituye nada):
#   1) Verificar rutas, rama, espacio disponible y estado del repositorio.
#   2) Backup completo de .git fuera del proyecto.
#   3) Clonar el repositorio publico de GitHub en un directorio temporal independiente.
#   4) Verificar integridad del clon (git fsck --full), rama main y commit == GitHub.
#   5) Detenerse tras verificar. NO sustituye el repositorio original.
# NO ejecuta deploy.sh, ni reset --hard, ni migraciones. No toca
# .env, private/, www/ ni MariaDB.

on:
  workflow_dispatch:

permissions:
  contents: read

# Mismo grupo que el despliegue: evita acceder a .git a la vez (serializa).
concurrency:
  group: todof1-production
  cancel-in-progress: false

jobs:
  recovery-phase2:
    name: Fase 2 (manual)
    runs-on: ubuntu-latest

    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Ejecutar Fase 2 por SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          ssh -i ~/.ssh/id_ed25519 \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE_SCRIPT'
          set -u
          export GIT_TERMINAL_PROMPT=0

          REPO_DIR="${TODOF1_REPO_DIR:-/home/todof1/todof1-app}"
          BRANCH="${TODOF1_BRANCH:-main}"
          REMOTE_URL="${TODOF1_REMOTE_URL:-https://github.com/Daniel-Zarco/TodoF1.git}"
          BACKUP_ROOT="${TODOF1_RECOVERY_DIR:-/home/todof1/todof1-recovery}"
          CLONE_ROOT="${TODOF1_CLONE_ROOT:-/home/todof1}"
          TS="$(date +%Y%m%d-%H%M%S)"
          BACKUP_DIR="$BACKUP_ROOT/$TS"
          CLONE_DIR="$CLONE_ROOT/todof1-clone-$TS"

          log()  { printf '[FASE2] %s\n' "$*"; }
          fail() { printf '[FASE2][ERROR] %s\n' "$*" >&2; exit 1; }

          log "===== INICIO FASE 2 ($(date '+%Y-%m-%d %H:%M:%S')) ====="

          # 1) Verificaciones previas
          command -v git >/dev/null 2>&1 || fail "No se encontro 'git'."
          command -v tar >/dev/null 2>&1 || fail "No se encontro 'tar'."
          [ -d "$REPO_DIR" ] || fail "No existe el repositorio: $REPO_DIR"
          [ -d "$REPO_DIR/.git" ] || fail "No existe $REPO_DIR/.git"
          cd "$REPO_DIR" || fail "No se puede entrar en $REPO_DIR"
          git rev-parse --is-inside-work-tree >/dev/null 2>&1 || fail "No es un repositorio git."

          current_branch="$(git rev-parse --abbrev-ref HEAD 2>&1)"
          log "Rama actual: $current_branch (esperada: $BRANCH)"
          [ "$current_branch" = "$BRANCH" ] || fail "Rama inesperada: '$current_branch'."

          echo "--- git remote -v ---"; git remote -v 2>&1; echo "[exit=$?]"
          echo "--- git log -1 --oneline ---"; git log -1 --oneline 2>&1; echo "[exit=$?]"
          echo "--- git status --porcelain (versionados) ---"; git status --porcelain --untracked-files=no 2>&1; echo "[exit=$?]"
          echo "--- git count-objects -v ---"; git count-objects -v 2>&1; echo "[exit=$?]"
          echo "--- espacio: df -h (repositorio) ---"; df -h . 2>&1; echo "[exit=$?]"
          echo "--- espacio: df -h (home) ---"; df -h "$HOME" 2>&1; echo "[exit=$?]"
          echo "--- tamano: du -sh .git ---"; du -sh .git 2>&1; echo "[exit=$?]"
          echo "--- git fsck --full (original) ---"; git fsck --full 2>&1; echo "[fsck_original_exit=$?]"

          [ -e "$BACKUP_DIR" ] && fail "El destino de backup ya existe: $BACKUP_DIR"
          [ -e "$CLONE_DIR" ] && fail "El destino del clon ya existe: $CLONE_DIR"

          # 2) Backup completo de .git fuera del proyecto
          log "Creando backup completo de .git en $BACKUP_DIR"
          mkdir -p "$BACKUP_DIR" || fail "No se pudo crear $BACKUP_DIR"
          tar -czf "$BACKUP_DIR/git-backup-$TS.tar.gz" .git || fail "El backup (tar) fallo."
          [ -f "$BACKUP_DIR/git-backup-$TS.tar.gz" ] || fail "No se genero el tar de backup."
          command -v sha256sum >/dev/null 2>&1 || fail "No se encontro 'sha256sum'."
          sha256sum "$BACKUP_DIR/git-backup-$TS.tar.gz" > "$BACKUP_DIR/git-backup-$TS.tar.gz.sha256" || fail "No se pudo calcular el SHA-256 del backup."
          sha256sum -c "$BACKUP_DIR/git-backup-$TS.tar.gz.sha256" || fail "El SHA-256 del backup no es valido."
          log "SHA-256 del backup verificado."
          {
            echo "repo: $REPO_DIR"
            echo "branch: $BRANCH"
            echo "remote_url: $REMOTE_URL"
            echo "HEAD:"
            git -C "$REPO_DIR" rev-parse HEAD 2>&1
            echo "remote:"
            git -C "$REPO_DIR" remote -v 2>&1
            echo "fsck:"
            git -C "$REPO_DIR" fsck --full 2>&1
            echo "count-objects:"
            git -C "$REPO_DIR" count-objects -v 2>&1
          } > "$BACKUP_DIR/estado-original.txt" 2>&1
          log "Backup creado: $(ls -lh "$BACKUP_DIR/git-backup-$TS.tar.gz" 2>&1)"

          # 3) Clonar el repositorio publico en un directorio temporal independiente
          log "Clonando $REMOTE_URL (rama $BRANCH) en $CLONE_DIR"
          mkdir -p "$CLONE_ROOT" || fail "No se pudo crear $CLONE_ROOT"
          git clone --branch "$BRANCH" "$REMOTE_URL" "$CLONE_DIR" 2>&1; clone_exit=$?
          echo "[clone_exit=$clone_exit]"
          [ "$clone_exit" -eq 0 ] || fail "git clone fallo (exit=$clone_exit). No se sustituye nada."

          # 4) Verificar integridad del clon
          [ -d "$CLONE_DIR/.git" ] || fail "El clon no contiene .git."
          echo "===== git fsck --full (clon) ====="
          git -C "$CLONE_DIR" fsck --full 2>&1; clone_fsck_exit=$?
          echo "[clone_fsck_exit=$clone_fsck_exit]"
          [ "$clone_fsck_exit" -eq 0 ] || fail "El clon no pasa fsck --full (exit=$clone_fsck_exit)."

          has_branch=0
          git -C "$CLONE_DIR" show-ref --verify --quiet "refs/heads/$BRANCH" && has_branch=1
          log "Rama '$BRANCH' presente en el clon: $has_branch"
          [ "$has_branch" -eq 1 ] || fail "El clon no contiene la rama '$BRANCH'."

          clone_dirty="$(git -C "$CLONE_DIR" status --porcelain 2>&1)"
          [ -z "$clone_dirty" ] || fail "El clon tiene cambios en el arbol de trabajo; no esta limpio."

          clone_head="$(git -C "$CLONE_DIR" rev-parse "refs/heads/$BRANCH" 2>&1)"
          clone_origin_head="$(git -C "$CLONE_DIR" rev-parse "refs/remotes/origin/$BRANCH" 2>&1)"
          remote_head="$(git ls-remote "$REMOTE_URL" "refs/heads/$BRANCH" 2>/dev/null | awk '{print $1}')"
          log "Commit clon        ($BRANCH): $clone_head"
          log "Commit origin/clon ($BRANCH): $clone_origin_head"
          log "Commit remoto      ($BRANCH): $remote_head"
          [ -n "$remote_head" ] || fail "No se pudo leer el commit remoto de GitHub (ls-remote)."
          [ "$clone_head" = "$clone_origin_head" ] || fail "La rama local del clon no coincide con origin/$BRANCH."
          [ "$clone_head" = "$remote_head" ] || fail "El commit del clon no coincide con GitHub."

          # 5) Detenerse sin sustituir el repositorio original
          log "RESULTADO FASE 2: backup=$BACKUP_DIR clon=$CLONE_DIR"
          log "clone_fsck_exit=$clone_fsck_exit has_branch=$has_branch commit=$clone_head"

          log "===== FIN FASE 2 ====="
          log "Repositorio original NO sustituido. deploy.sh NO ejecutado. Paso manual."
          exit 0
          REMOTE_SCRIPT
