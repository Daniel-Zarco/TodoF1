name: Image budget

on:
  push:
    branches:
      - main
    paths:
      - 'Images/**'
      - 'deploy/*.sh'
      - '.github/workflows/image-budget.yml'
  pull_request:
    paths:
      - 'Images/**'
      - 'deploy/*.sh'
      - '.github/workflows/image-budget.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  budget:
    name: Check image storage budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate deploy shell scripts
        run: |
          bash -n deploy/deploy.sh
          bash -n deploy/check-image-budget.sh
          bash -n deploy/prune-deploy-backups.sh
          bash -n deploy/test-prune-deploy-backups.sh
      - name: Check images
        env:
          IMAGE_MAX_KB: 250
          IMAGE_BUDGET_MB: 85
        run: bash deploy/check-image-budget.sh
